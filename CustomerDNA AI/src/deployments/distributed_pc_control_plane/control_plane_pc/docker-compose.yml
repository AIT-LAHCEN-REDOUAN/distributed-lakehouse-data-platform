x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.2.2-python3.11}
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: ${AIRFLOW__CORE__DEFAULT_TIMEZONE:-Africa/Casablanca}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: ${AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK:-true}
    AIRFLOW__CORE__TEST_CONNECTION: ${AIRFLOW__CORE__TEST_CONNECTION:-Enabled}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API__BASE_URL: ${AIRFLOW__API__BASE_URL:-http://localhost:8080}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-customerdna-control-plane-demo-jwt-secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    CUSTOMERDNA_AIRFLOW_KAFKA_BOOTSTRAP_SERVERS: ${CUSTOMERDNA_AIRFLOW_KAFKA_BOOTSTRAP_SERVERS}
    CUSTOMERDNA_AIRFLOW_HDFS_WEB_ENDPOINT: ${CUSTOMERDNA_AIRFLOW_HDFS_WEB_ENDPOINT}
    CUSTOMERDNA_AIRFLOW_HDFS_NAMENODE_URI: ${CUSTOMERDNA_AIRFLOW_HDFS_NAMENODE_URI}
    CUSTOMERDNA_AIRFLOW_HIVE_METASTORE_HOST: ${CUSTOMERDNA_AIRFLOW_HIVE_METASTORE_HOST}
    CUSTOMERDNA_AIRFLOW_HIVE_METASTORE_PORT: ${CUSTOMERDNA_AIRFLOW_HIVE_METASTORE_PORT}
    CUSTOMERDNA_AIRFLOW_SPARK_MASTER_UI_URL: ${CUSTOMERDNA_AIRFLOW_SPARK_MASTER_UI_URL}
    CUSTOMERDNA_AIRFLOW_DBT_SPARK_HOST: ${CUSTOMERDNA_AIRFLOW_DBT_SPARK_HOST}
    CUSTOMERDNA_AIRFLOW_DBT_SPARK_PORT: ${CUSTOMERDNA_AIRFLOW_DBT_SPARK_PORT}
    CUSTOMERDNA_AIRFLOW_TRINO_URL: ${CUSTOMERDNA_AIRFLOW_TRINO_URL}
    CUSTOMERDNA_HDFS_BRONZE_ROOT: ${CUSTOMERDNA_HDFS_BRONZE_ROOT:-/bronze/client_1}
    CUSTOMERDNA_SPARK_SUBMIT_CONTAINER: ${CUSTOMERDNA_SPARK_SUBMIT_CONTAINER:-spark-submit-client}
    CUSTOMERDNA_SPARK_MASTER_URL: ${CUSTOMERDNA_SPARK_MASTER_URL}
    CUSTOMERDNA_SPARK_BASE_IMAGE: ${CUSTOMERDNA_SPARK_BASE_IMAGE:-spark:4.1.2-python3}
    CUSTOMERDNA_SPARK_ICEBERG_VERSION: ${CUSTOMERDNA_SPARK_ICEBERG_VERSION:-1.11.0}
    CUSTOMERDNA_SPARK_POSTGRES_JDBC_VERSION: ${CUSTOMERDNA_SPARK_POSTGRES_JDBC_VERSION:-42.7.4}
    CUSTOMERDNA_SPARK_EXTRA_CLASSPATH: ${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH}
    CUSTOMERDNA_HIVE_METASTORE_URI: ${CUSTOMERDNA_HIVE_METASTORE_URI}
    CUSTOMERDNA_ICEBERG_CATALOG_NAME: ${CUSTOMERDNA_ICEBERG_CATALOG_NAME:-customerdna}
    CUSTOMERDNA_ICEBERG_WAREHOUSE_URI: ${CUSTOMERDNA_ICEBERG_WAREHOUSE_URI}
    CUSTOMERDNA_SPARK_BIN: ${CUSTOMERDNA_SPARK_BIN:-/opt/spark/bin/spark-submit}
    CUSTOMERDNA_SPARK_JOBS_ROOT_IN_CONTAINER: ${CUSTOMERDNA_SPARK_JOBS_ROOT_IN_CONTAINER:-/opt/spark/jobs}
    CUSTOMERDNA_SPARK_JOB_PATH: ${CUSTOMERDNA_SPARK_JOB_PATH:-/opt/spark/jobs/client_1/load_hdfs_bronze_to_iceberg.py}
    CUSTOMERDNA_SPARK_HOME_DIR: ${CUSTOMERDNA_SPARK_HOME_DIR:-/opt/spark/work-dir}
    CUSTOMERDNA_SPARK_IVY_HOME: ${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2}
    CUSTOMERDNA_SPARK_THRIFT_HOST: ${CUSTOMERDNA_SPARK_THRIFT_HOST}
    CUSTOMERDNA_SPARK_THRIFT_PORT: ${CUSTOMERDNA_SPARK_THRIFT_PORT:-10000}
    _PIP_ADDITIONAL_REQUIREMENTS: -r /requirements.txt
  volumes:
    - ../../../airflow/dags:/opt/airflow/dags
    - ./runtime/airflow/logs:/opt/airflow/logs
    - ../../../airflow/plugins:/opt/airflow/plugins
    - ../../../airflow/config:/opt/airflow/config
    - ${CUSTOMERDNA_PROJECT_ROOT_MOUNT:-../../../..}:${CUSTOMERDNA_PROJECT_ROOT_IN_CONTAINER:-/opt/airflow/CustomerDNA_AI}
    - ../../../airflow/requirements.txt:/requirements.txt
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  depends_on:
    airflow-postgres:
      condition: service_healthy
    spark-submit-client:
      condition: service_started

services:
  spark-submit-client:
    build:
      context: ../../../processing/spark
      dockerfile: Dockerfile
      args:
        SPARK_BASE_IMAGE: ${CUSTOMERDNA_SPARK_BASE_IMAGE:-spark:4.1.2-python3}
        ICEBERG_VERSION: ${CUSTOMERDNA_SPARK_ICEBERG_VERSION:-1.11.0}
        POSTGRES_JDBC_VERSION: ${CUSTOMERDNA_SPARK_POSTGRES_JDBC_VERSION:-42.7.4}
    image: ${CUSTOMERDNA_SPARK_SUBMIT_CLIENT_IMAGE:-customerdna-spark:4.1.2-iceberg-control-plane}
    container_name: spark-submit-client
    hostname: spark-submit-client
    restart: unless-stopped
    environment:
      HOME: ${CUSTOMERDNA_SPARK_HOME_DIR:-/opt/spark/work-dir}
      IVY_HOME: ${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2}
      SPARK_CONF_DIR: /opt/spark/custom-conf
      SPARK_CLASSPATH: ${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH}
      SPARK_SUBMIT_OPTS: -Divy.home=${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2} -Divy.cache.dir=${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2}/cache
      CUSTOMERDNA_HIVE_METASTORE_URI: ${CUSTOMERDNA_HIVE_METASTORE_URI}
      CUSTOMERDNA_ICEBERG_WAREHOUSE_URI: ${CUSTOMERDNA_ICEBERG_WAREHOUSE_URI}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../../processing/spark/jobs:${CUSTOMERDNA_SPARK_JOBS_ROOT_IN_CONTAINER:-/opt/spark/jobs}
      - ../../../processing/spark/config:/opt/spark/custom-conf:ro
      - ./runtime/spark/.ivy2:${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2}
    command:
      - /bin/sh
      - -lc
      - >
        mkdir -p ${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2}/cache
        ${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2}/jars
        && while true; do sleep 3600; done

  airflow-postgres:
    image: postgres:16
    container_name: control_plane_airflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - ${AIRFLOW_POSTGRES_USER:-airflow}
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    container_name: control_plane_airflow_init
    entrypoint: /bin/bash
    command:
      - -lc
      - >
        airflow db migrate &&
        airflow users create
        --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}"
        --password "${_AIRFLOW_WWW_USER_PASSWORD:-admin}"
        --firstname "${_AIRFLOW_WWW_USER_FIRSTNAME:-Admin}"
        --lastname "${_AIRFLOW_WWW_USER_LASTNAME:-User}"
        --role Admin
        --email "${_AIRFLOW_WWW_USER_EMAIL:-admin@customerdna.local}" || true
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    container_name: control_plane_airflow_api_server
    command: api-server
    ports:
      - "${CUSTOMERDNA_CONTROL_PLANE_AIRFLOW_PORT:-18080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8080/api/v2/version")
      interval: 15s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: control_plane_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-api-server:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: control_plane_airflow_dag_processor
    command: dag-processor
    depends_on:
      airflow-api-server:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: control_plane_airflow_triggerer
    command: triggerer
    depends_on:
      airflow-api-server:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: control_plane_postgres_exporter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_SOURCE_URI: ${CUSTOMERDNA_MONITORING_POSTGRES_HOST:-10.10.252.12}:${CUSTOMERDNA_POSTGRES_PORT:-5435}/${CUSTOMERDNA_POSTGRES_DB:-metastore_db}?sslmode=disable
      DATA_SOURCE_USER: ${CUSTOMERDNA_POSTGRES_USER:-hive}
      DATA_SOURCE_PASS: ${CUSTOMERDNA_POSTGRES_PASSWORD:-hive_password}

  pipeline-metrics-exporter:
    image: python:3.11-slim
    container_name: control_plane_pipeline_metrics_exporter
    restart: unless-stopped
    env_file:
      - .env
    working_dir: ${CUSTOMERDNA_MONITORING_ROOT_IN_CONTAINER:-/monitoring}
    command: python ${CUSTOMERDNA_MONITORING_EXPORTER_SCRIPT:-/monitoring/exporters/pipeline_metrics_exporter.py}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../../monitoring:${CUSTOMERDNA_MONITORING_ROOT_IN_CONTAINER:-/monitoring}:rw

  prometheus:
    image: prom/prometheus:latest
    container_name: control_plane_prometheus
    restart: unless-stopped
    depends_on:
      - postgres-exporter
      - pipeline-metrics-exporter
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${CUSTOMERDNA_CONTROL_PLANE_PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: control_plane_kafka_ui
    restart: unless-stopped
    ports:
      - "${CUSTOMERDNA_CONTROL_PLANE_KAFKA_UI_PORT:-18085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ${CUSTOMERDNA_KAFKA_UI_CLUSTER_NAME:-customerdna-distributed}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${CUSTOMERDNA_KAFKA_UI_BOOTSTRAP_SERVERS}
      DYNAMIC_CONFIG_ENABLED: "true"

  grafana:
    image: grafana/grafana:latest
    container_name: control_plane_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${CUSTOMERDNA_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${CUSTOMERDNA_GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${CUSTOMERDNA_CONTROL_PLANE_GRAFANA_PORT:-13001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards/customerdna:ro

volumes:
  airflow_postgres_data:
  grafana_data:
  prometheus_data:
