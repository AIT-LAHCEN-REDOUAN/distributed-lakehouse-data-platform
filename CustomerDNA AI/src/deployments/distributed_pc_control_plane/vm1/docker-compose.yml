services:
  broker-1:
    image: apache/kafka:4.3.1
    container_name: broker-1
    hostname: broker-1
    network_mode: host
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${CUSTOMERDNA_KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${VM1_HOST_IP}:29092,EXTERNAL://${VM1_HOST_IP}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@${VM1_HOST_IP}:9093,2@${VM2_HOST_IP}:9093,3@${VM3_HOST_IP}:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${CUSTOMERDNA_KAFKA_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${CUSTOMERDNA_KAFKA_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${CUSTOMERDNA_KAFKA_MIN_INSYNC_REPLICAS}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${CUSTOMERDNA_KAFKA_DEFAULT_PARTITIONS}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - ${CUSTOMERDNA_RUNTIME_KAFKA_DATA_DIR:-./runtime/kafka/data}:/var/lib/kafka/data

  datanode-1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode-1
    hostname: datanode-1
    network_mode: host
    extra_hosts:
      - "datanode-1:${VM1_HOST_IP}"
      - "datanode-2:${VM2_HOST_IP}"
      - "datanode-3:${VM3_HOST_IP}"
      - "namenode:${VM2_HOST_IP}"
    restart: unless-stopped
    environment:
      CORE_CONF_fs_defaultFS: ${CUSTOMERDNA_HDFS_NAMENODE_URI}
      CORE_CONF_hadoop_security_authentication: kerberos
      CORE_CONF_hadoop_security_authorization: "true"
      CORE_CONF_hadoop_security_auth_to_local: "RULE:[1:$1@$0](demo_hdfs@${CUSTOMERDNA_KRB5_REALM})s/.*/hdfs/ RULE:[1:$1@$0](.*@${CUSTOMERDNA_KRB5_REALM})s/@.*// RULE:[2:$1/$2@$0](.*@${CUSTOMERDNA_KRB5_REALM})s/.*/hdfs/ DEFAULT"
      CORE_CONF_hadoop_rpc_protection: ${CUSTOMERDNA_HDFS_RPC_PROTECTION}
      CORE_CONF_hadoop_http_authentication_type: kerberos
      CORE_CONF_hadoop_http_authentication_kerberos_principal: HTTP/_HOST@${CUSTOMERDNA_KRB5_REALM}
      CORE_CONF_hadoop_http_authentication_kerberos_keytab: /etc/security/keytabs/dn.service.keytab
      CORE_CONF_hadoop_http_authentication_simple_anonymous_allowed: "false"
      HDFS_CONF_dfs_replication: ${CUSTOMERDNA_HDFS_REPLICATION}
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_http_policy: HTTPS_ONLY
      HDFS_CONF_dfs_webhdfs_enabled: "true"
      HDFS_CONF_dfs_block_access_token_enable: "true"
      HDFS_CONF_dfs_datanode_kerberos_principal: dn/_HOST@${CUSTOMERDNA_KRB5_REALM}
      HDFS_CONF_dfs_datanode_keytab_file: /etc/security/keytabs/dn.service.keytab
      HDFS_CONF_dfs_web_authentication_kerberos_principal: HTTP/_HOST@${CUSTOMERDNA_KRB5_REALM}
      HDFS_CONF_dfs_web_authentication_kerberos_keytab: /etc/security/keytabs/dn.service.keytab
      HDFS_CONF_dfs_datanode_kerberos_internal_spnego_principal: HTTP/_HOST@${CUSTOMERDNA_KRB5_REALM}
      HDFS_CONF_dfs_datanode_http___address: 0.0.0.0:0
      HDFS_CONF_dfs_datanode_https___address: 0.0.0.0:${CUSTOMERDNA_HDFS_DATANODE_HTTPS_PORT:-9865}
      HDFS_CONF_dfs_https_server_keystore_resource: ssl-server.xml
      HDFS_CONF_dfs_client_https_need___auth: "false"
      HDFS_CONF_dfs_client_https_keystore_resource: ssl-client.xml
      HDFS_CONF_dfs_data_transfer_protection: ${CUSTOMERDNA_HDFS_DATA_TRANSFER_PROTECTION}
      HDFS_CONF_dfs_encrypt_data_transfer: ${CUSTOMERDNA_HDFS_WIRE_ENCRYPTION}
      HDFS_CONF_dfs_datanode_hostname: datanode-1
      HDFS_CONF_dfs_datanode_use_datanode_hostname: "true"
      HDFS_CONF_dfs_client_use_datanode_hostname: "true"
      KRB5_CONFIG: /etc/krb5.conf
      HADOOP_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf
      SERVICE_PRECONDITION: namenode:${CUSTOMERDNA_HDFS_NAMENODE_HTTPS_PORT:-9871}
    volumes:
      - ${CUSTOMERDNA_RUNTIME_HDFS_DATANODE_DIR:-./runtime/hdfs/datanode}:/hadoop/dfs/data
      - ./hdfs/tls/ssl-server.xml:/etc/hadoop/ssl-server.xml:ro
      - ./hdfs/tls/ssl-client.xml:/etc/hadoop/ssl-client.xml:ro
      - ./hdfs/tls:/etc/hadoop/tls:ro
      - ./kerberos/krb5.conf:/etc/krb5.conf:ro
      - ${CUSTOMERDNA_RUNTIME_KERBEROS_KEYTAB_DIR:-./runtime/kerberos/keytabs}/datanode-1:/etc/security/keytabs:ro
    healthcheck:
      disable: true

  spark-worker-1:
    build:
      context: ./spark
      dockerfile: Dockerfile
      args:
        SPARK_BASE_IMAGE: ${CUSTOMERDNA_SPARK_BASE_IMAGE}
        ICEBERG_VERSION: ${CUSTOMERDNA_SPARK_ICEBERG_VERSION}
        POSTGRES_JDBC_VERSION: ${CUSTOMERDNA_SPARK_POSTGRES_JDBC_VERSION}
    image: ${CUSTOMERDNA_SPARK_IMAGE}
    container_name: spark-worker-1
    hostname: spark-worker-1
    network_mode: host
    extra_hosts:
      - "namenode:${VM2_HOST_IP}"
      - "hive-metastore:${VM2_HOST_IP}"
      - "spark-thrift-server:${VM2_HOST_IP}"
      - "spark-master:${VM2_HOST_IP}"
    restart: unless-stopped
    environment:
      HOME: /opt/spark/work-dir
      IVY_HOME: /opt/spark/work-dir/.ivy2
      KRB5_CONFIG: /etc/krb5.conf
      HADOOP_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf
      SPARK_CONF_DIR: /opt/spark/custom-conf
      SPARK_CLASSPATH: ${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH}
      SPARK_SUBMIT_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf -Divy.home=/opt/spark/work-dir/.ivy2 -Divy.cache.dir=/opt/spark/work-dir/.ivy2/cache
      SPARK_DAEMON_JAVA_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf
      SPARK_LOCAL_IP: ${VM1_HOST_IP}
      SPARK_PUBLIC_DNS: ${VM1_HOST_IP}
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://${VM2_HOST_IP}:${SPARK_MASTER_PORT}
      - --webui-port
      - ${SPARK_WORKER_WEBUI_PORT}
      - --cores
      - ${SPARK_WORKER_CORES}
      - --memory
      - ${SPARK_WORKER_MEMORY}
    volumes:
      - ${CUSTOMERDNA_RUNTIME_SPARK_EVENTS_DIR:-./runtime/spark/events}:/tmp/spark-events
      - ${CUSTOMERDNA_RUNTIME_SPARK_IVY2_DIR:-./runtime/spark/ivy2}:/opt/spark/work-dir/.ivy2
      - ./spark/config:/opt/spark/custom-conf:ro
      - ./kerberos/krb5.conf:/etc/krb5.conf:ro
      - ${CUSTOMERDNA_RUNTIME_KERBEROS_KEYTAB_DIR:-./runtime/kerberos/keytabs}/spark:/etc/security/keytabs:ro

  trino-worker-1:
    image: trinodb/trino:${TRINO_VERSION}
    container_name: trino-worker-1
    hostname: trino-worker-1
    network_mode: host
    restart: unless-stopped
    extra_hosts:
      - "namenode:${VM2_HOST_IP}"
      - "hive-metastore:${VM2_HOST_IP}"
      - "datanode-1:${VM1_HOST_IP}"
      - "datanode-2:${VM2_HOST_IP}"
      - "datanode-3:${VM3_HOST_IP}"
    volumes:
      - ./trino/etc:/etc/trino:ro
      - ${CUSTOMERDNA_RUNTIME_TRINO_DATA_DIR:-./runtime/trino/data}:/var/trino/data
      - ./kerberos/krb5.conf:/etc/krb5.conf:ro
      - ${CUSTOMERDNA_RUNTIME_KERBEROS_KEYTAB_DIR:-./runtime/kerberos/keytabs}/trino:/etc/security/keytabs:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: vm1_cadvisor
    network_mode: host
    restart: unless-stopped
    environment:
      CADVISOR_HEALTHCHECK_URL: http://127.0.0.1:8081/healthz
    command:
      - --port=8081
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
