services:
  kerberos-kdc:
    build:
      context: ./kerberos/kdc
    image: customerdna-kerberos-kdc:vm2
    container_name: kerberos-kdc
    hostname: kerberos-kdc
    network_mode: host
    restart: unless-stopped
    environment:
      CUSTOMERDNA_KRB5_REALM: ${CUSTOMERDNA_KRB5_REALM}
      CUSTOMERDNA_KRB5_MASTER_PASSWORD: ${CUSTOMERDNA_KRB5_MASTER_PASSWORD}
      CUSTOMERDNA_KRB5_ADMIN_PRINCIPAL: ${CUSTOMERDNA_KRB5_ADMIN_PRINCIPAL}
      CUSTOMERDNA_KRB5_ADMIN_PASSWORD: ${CUSTOMERDNA_KRB5_ADMIN_PASSWORD}
    volumes:
      - ${CUSTOMERDNA_RUNTIME_KERBEROS_KDC_DB_DIR:-./runtime/kerberos/kdc_db}:/var/lib/krb5kdc
      - ./kerberos/krb5.conf:/etc/krb5.conf:ro
      - ./kerberos/kdc/kdc.conf:/etc/krb5kdc/kdc.conf:ro
      - ./kerberos/kdc/kadm5.acl:/etc/krb5kdc/kadm5.acl:ro

  broker-2:
    image: apache/kafka:4.3.1
    container_name: broker-2
    hostname: broker-2
    network_mode: host
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${CUSTOMERDNA_KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${VM2_HOST_IP}:29092,EXTERNAL://${VM2_HOST_IP}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@${VM1_HOST_IP}:9093,2@${VM2_HOST_IP}:9093,3@${VM3_HOST_IP}:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${CUSTOMERDNA_KAFKA_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${CUSTOMERDNA_KAFKA_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${CUSTOMERDNA_KAFKA_MIN_INSYNC_REPLICAS}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${CUSTOMERDNA_KAFKA_DEFAULT_PARTITIONS}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - ${CUSTOMERDNA_RUNTIME_KAFKA_DATA_DIR:-./runtime/kafka/data}:/var/lib/kafka/data

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    network_mode: host
    extra_hosts:
      - "namenode:${VM2_HOST_IP}"
      - "namenode.customerdna.local:${VM2_HOST_IP}"
    restart: unless-stopped
    depends_on:
      - kerberos-kdc
    environment:
      CLUSTER_NAME: ${CUSTOMERDNA_CLUSTER_NAME}
      KRB5_CONFIG: /etc/krb5.conf
      HADOOP_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf -Djava.security.auth.login.config=/opt/spark/custom-conf/jaas.conf
    volumes:
      - ${CUSTOMERDNA_RUNTIME_HDFS_NAMENODE_DIR:-./runtime/hdfs/namenode}:/hadoop/dfs/name
      - ./hdfs/namenode-config/core-site.xml:/etc/hadoop/core-site.xml:ro
      - ./hdfs/namenode-config/hdfs-site.xml:/etc/hadoop/hdfs-site.xml:ro
      - ./hdfs/tls/ssl-server.xml:/etc/hadoop/ssl-server.xml:ro
      - ./hdfs/tls/ssl-client.xml:/etc/hadoop/ssl-client.xml:ro
      - ./hdfs/tls:/etc/hadoop/tls:ro
      - ./kerberos/krb5.conf:/etc/krb5.conf:ro
      - ${CUSTOMERDNA_RUNTIME_KERBEROS_KEYTAB_DIR:-./runtime/kerberos/keytabs}/namenode:/etc/security/keytabs:ro
    healthcheck:
      disable: true

  datanode-2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode-2
    hostname: datanode-2
    network_mode: host
    extra_hosts:
      - "datanode-2:${VM2_HOST_IP}"
      - "datanode-2.customerdna.local:${VM2_HOST_IP}"
      - "datanode-1:${VM1_HOST_IP}"
      - "datanode-3:${VM3_HOST_IP}"
      - "namenode:${VM2_HOST_IP}"
      - "namenode.customerdna.local:${VM2_HOST_IP}"
    restart: unless-stopped
    depends_on:
      - namenode
      - kerberos-kdc
    environment:
      KRB5_CONFIG: /etc/krb5.conf
      HADOOP_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf
      SERVICE_PRECONDITION: namenode:${CUSTOMERDNA_HDFS_NAMENODE_HTTPS_PORT:-9871}
    volumes:
      - ${CUSTOMERDNA_RUNTIME_HDFS_DATANODE_DIR:-./runtime/hdfs/datanode}:/hadoop/dfs/data
      - ./hdfs/datanode-config/core-site.xml:/etc/hadoop/core-site.xml:ro
      - ./hdfs/datanode-config/hdfs-site.xml:/etc/hadoop/hdfs-site.xml:ro
      - ./hdfs/tls/ssl-server.xml:/etc/hadoop/ssl-server.xml:ro
      - ./hdfs/tls/ssl-client.xml:/etc/hadoop/ssl-client.xml:ro
      - ./hdfs/tls:/etc/hadoop/tls:ro
      - ./kerberos/krb5.conf:/etc/krb5.conf:ro
      - ${CUSTOMERDNA_RUNTIME_KERBEROS_KEYTAB_DIR:-./runtime/kerberos/keytabs}/datanode-2:/etc/security/keytabs:ro
    healthcheck:
      disable: true

  hdfs-admin-client:
    build:
      context: ./kerberos/hdfs_admin_client
    image: customerdna-hdfs-admin-client:vm2
    container_name: hdfs-admin-client
    hostname: hdfs-admin-client.customerdna.local
    network_mode: host
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - >
        kinit -kt ${CUSTOMERDNA_HDFS_ADMIN_KEYTAB} airflow@${CUSTOMERDNA_KRB5_REALM}
        && while true; do
             sleep 1800;
             kinit -R || kinit -kt ${CUSTOMERDNA_HDFS_ADMIN_KEYTAB} airflow@${CUSTOMERDNA_KRB5_REALM};
           done
    extra_hosts:
      - "hdfs-admin-client:${VM2_HOST_IP}"
      - "hdfs-admin-client.customerdna.local:${VM2_HOST_IP}"
      - "namenode:${VM2_HOST_IP}"
      - "namenode.customerdna.local:${VM2_HOST_IP}"
      - "datanode-1:${VM1_HOST_IP}"
      - "datanode-1.customerdna.local:${VM1_HOST_IP}"
      - "datanode-2:${VM2_HOST_IP}"
      - "datanode-2.customerdna.local:${VM2_HOST_IP}"
      - "datanode-3:${VM3_HOST_IP}"
      - "datanode-3.customerdna.local:${VM3_HOST_IP}"
      - "hive-metastore:${VM2_HOST_IP}"
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      - kerberos-kdc
      - namenode
      - datanode-2
    environment:
      KRB5_CONFIG: /etc/krb5.conf
      HADOOP_CONF_DIR: /etc/hadoop/conf
      CORE_CONF_fs_defaultFS: ${CUSTOMERDNA_HDFS_NAMENODE_URI}
      CORE_CONF_hadoop_security_authentication: kerberos
      CORE_CONF_hadoop_security_authorization: "true"
      CORE_CONF_hadoop_security_auth_to_local: "RULE:[1:$1@$0](demo_hdfs@${CUSTOMERDNA_KRB5_REALM})s/.*/hdfs/ RULE:[2:$1/$2@$0](nn/.*@${CUSTOMERDNA_KRB5_REALM})s/.*/hdfs/ RULE:[2:$1/$2@$0](dn/.*@${CUSTOMERDNA_KRB5_REALM})s/.*/hdfs/ RULE:[2:$1/$2@$0](HTTP/.*@${CUSTOMERDNA_KRB5_REALM})s/.*/hdfs/ RULE:[2:$1/$2@$0](hive/.*@${CUSTOMERDNA_KRB5_REALM})s/.*/hive/ RULE:[2:$1/$2@$0](trino/.*@${CUSTOMERDNA_KRB5_REALM})s/.*/trino/ RULE:[2:$1/$2@$0](spark/.*@${CUSTOMERDNA_KRB5_REALM})s/.*/spark/ RULE:[1:$1@$0](.*@${CUSTOMERDNA_KRB5_REALM})s/@.*// DEFAULT"
      CORE_CONF_hadoop_proxyuser_hive_hosts: 127.0.0.1,localhost,${VM2_HOST_IP},hive-metastore,hive-metastore.customerdna.local
      CORE_CONF_hadoop_proxyuser_hive_groups: "*"
      CORE_CONF_hadoop_rpc_protection: ${CUSTOMERDNA_HDFS_RPC_PROTECTION}
    volumes:
      - ./kerberos/krb5.conf:/etc/krb5.conf:ro
      - ./hdfs/config:/etc/hadoop/conf:ro
      - ${CUSTOMERDNA_RUNTIME_KERBEROS_KEYTAB_DIR:-./runtime/kerberos/keytabs}/airflow:/etc/security/keytabs:ro
      - ${CUSTOMERDNA_RUNTIME_HDFS_ADMIN_STAGING_DIR:-./runtime/hdfs/admin_staging}:${CUSTOMERDNA_RUNTIME_HDFS_ADMIN_STAGING_DIR:-./runtime/hdfs/admin_staging}

  hive-metastore-db:
    image: postgres:14-alpine
    container_name: hive-metastore-db
    hostname: hive-metastore-db
    network_mode: host
    restart: unless-stopped
    command:
      - postgres
      - -p
      - ${HIVE_METASTORE_POSTGRES_PORT}
      - -c
      - password_encryption=md5
    environment:
      POSTGRES_DB: ${HIVE_METASTORE_DB}
      POSTGRES_USER: ${HIVE_METASTORE_USER}
      POSTGRES_PASSWORD: ${HIVE_METASTORE_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=md5 --auth-local=md5
    volumes:
      - ${CUSTOMERDNA_RUNTIME_HIVE_POSTGRES_DIR:-./runtime/hive/postgres}:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p ${HIVE_METASTORE_POSTGRES_PORT} -U ${HIVE_METASTORE_USER} -d ${HIVE_METASTORE_DB}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  hive-metastore:
    build:
      context: ./hive/metastore
      args:
        HIVE_METASTORE_VERSION: ${HIVE_METASTORE_VERSION}
        POSTGRES_JDBC_VERSION: ${POSTGRES_JDBC_VERSION}
    image: customerdna-hive-metastore:${HIVE_METASTORE_VERSION}-vm2
    container_name: hive-metastore
    hostname: hive-metastore
    network_mode: host
    extra_hosts:
      - "hive-metastore:${VM2_HOST_IP}"
    restart: on-failure
    depends_on:
      kerberos-kdc:
        condition: service_started
      hive-metastore-db:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      KRB5_CONFIG: /etc/krb5.conf
      HADOOP_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://127.0.0.1:${HIVE_METASTORE_POSTGRES_PORT}/${HIVE_METASTORE_DB}
        -Djavax.jdo.option.ConnectionUserName=${HIVE_METASTORE_USER}
        -Djavax.jdo.option.ConnectionPassword=${HIVE_METASTORE_PASSWORD}
    volumes:
      - ./hive/config:/hive_custom_conf:ro
      - ./kerberos/krb5.conf:/etc/krb5.conf:ro
      - ${CUSTOMERDNA_RUNTIME_KERBEROS_KEYTAB_DIR:-./runtime/kerberos/keytabs}/hive:/etc/security/keytabs:ro

  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
      args:
        SPARK_BASE_IMAGE: ${CUSTOMERDNA_SPARK_BASE_IMAGE}
        ICEBERG_VERSION: ${CUSTOMERDNA_SPARK_ICEBERG_VERSION}
        POSTGRES_JDBC_VERSION: ${CUSTOMERDNA_SPARK_POSTGRES_JDBC_VERSION}
    image: ${CUSTOMERDNA_SPARK_IMAGE}
    container_name: spark-master
    hostname: spark-master.customerdna.local
    network_mode: host
    extra_hosts:
      - "spark-master:${VM2_HOST_IP}"
      - "spark-master.customerdna.local:${VM2_HOST_IP}"
      - "namenode:${VM2_HOST_IP}"
      - "namenode.customerdna.local:${VM2_HOST_IP}"
      - "hive-metastore:${VM2_HOST_IP}"
    restart: unless-stopped
    environment:
      HOME: /opt/spark/work-dir
      IVY_HOME: /opt/spark/work-dir/.ivy2
      HADOOP_CONF_DIR: /etc/hadoop/conf
      KRB5_CONFIG: /etc/krb5.conf
      HADOOP_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf
      SPARK_CONF_DIR: /opt/spark/custom-conf
      SPARK_CLASSPATH: ${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH}
      SPARK_SUBMIT_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf -Djava.security.auth.login.config=/opt/spark/custom-conf/jaas.conf -Divy.home=/opt/spark/work-dir/.ivy2 -Divy.cache.dir=/opt/spark/work-dir/.ivy2/cache
      SPARK_DAEMON_JAVA_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf -Djava.security.auth.login.config=/opt/spark/custom-conf/jaas.conf
      SPARK_LOCAL_IP: ${VM2_HOST_IP}
      SPARK_PUBLIC_DNS: ${VM2_HOST_IP}
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - ${VM2_HOST_IP}
      - --port
      - ${SPARK_MASTER_PORT}
      - --webui-port
      - ${SPARK_MASTER_WEBUI_PORT}
    volumes:
      - ${CUSTOMERDNA_RUNTIME_SPARK_EVENTS_DIR:-./runtime/spark/events}:/tmp/spark-events
      - ${CUSTOMERDNA_RUNTIME_SPARK_IVY2_DIR:-./runtime/spark/ivy2}:/opt/spark/work-dir/.ivy2
      - ./spark/config:/opt/spark/custom-conf:ro
      - ./hdfs/config:/etc/hadoop/conf:ro
      - ./kerberos/krb5.conf:/etc/krb5.conf:ro
      - ${CUSTOMERDNA_RUNTIME_KERBEROS_KEYTAB_DIR:-./runtime/kerberos/keytabs}/spark:/etc/security/keytabs:ro

  spark-submit-client:
    image: ${CUSTOMERDNA_SPARK_IMAGE}
    container_name: spark-submit-client
    hostname: spark-submit-client.customerdna.local
    network_mode: host
    extra_hosts:
      - "namenode:${VM2_HOST_IP}"
      - "namenode.customerdna.local:${VM2_HOST_IP}"
      - "hive-metastore:${VM2_HOST_IP}"
      - "spark-submit-client:${VM2_HOST_IP}"
      - "spark-submit-client.customerdna.local:${VM2_HOST_IP}"
    restart: unless-stopped
    depends_on:
      - kerberos-kdc
      - spark-master
      - hive-metastore
      - namenode
    environment:
      HOME: /opt/spark/work-dir
      IVY_HOME: /opt/spark/work-dir/.ivy2
      HADOOP_CONF_DIR: /etc/hadoop/conf
      KRB5_CONFIG: /etc/krb5.conf
      KRB5CCNAME: FILE:/tmp/krb5cc_spark
      KRB5_CLIENT_KTNAME: ${CUSTOMERDNA_SPARK_KERBEROS_KEYTAB}
      HADOOP_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf -Djava.security.auth.login.config=/opt/spark/custom-conf/jaas.conf -Djavax.security.auth.useSubjectCredsOnly=false
      SPARK_CONF_DIR: /opt/spark/custom-conf
      SPARK_CLASSPATH: ${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH}
      SPARK_SUBMIT_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf -Djava.security.auth.login.config=/opt/spark/custom-conf/jaas.conf -Djavax.security.auth.useSubjectCredsOnly=false -Divy.home=/opt/spark/work-dir/.ivy2 -Divy.cache.dir=/opt/spark/work-dir/.ivy2/cache
      SPARK_LOCAL_IP: ${VM2_HOST_IP}
      SPARK_PUBLIC_DNS: ${VM2_HOST_IP}
      CUSTOMERDNA_HIVE_METASTORE_URI: thrift://${VM2_HOST_IP}:${HIVE_METASTORE_PORT}
      CUSTOMERDNA_ICEBERG_WAREHOUSE_URI: ${CUSTOMERDNA_ICEBERG_WAREHOUSE_URI}
      CUSTOMERDNA_SPARK_DRIVER_HOST: ${CUSTOMERDNA_SPARK_DRIVER_HOST:-${VM2_HOST_IP}}
      CUSTOMERDNA_SPARK_DRIVER_BIND_ADDRESS: ${CUSTOMERDNA_SPARK_DRIVER_BIND_ADDRESS:-0.0.0.0}
      CUSTOMERDNA_SPARK_DRIVER_PORT: ${CUSTOMERDNA_SPARK_DRIVER_PORT:-35001}
      CUSTOMERDNA_SPARK_BLOCKMANAGER_PORT: ${CUSTOMERDNA_SPARK_BLOCKMANAGER_PORT:-35002}
      SPARK_LOCAL_HOSTNAME: spark-submit-client.customerdna.local
    volumes:
      - ${CUSTOMERDNA_RUNTIME_SPARK_IVY2_DIR:-./runtime/spark/ivy2}:/opt/spark/work-dir/.ivy2
      - ./spark/config:/opt/spark/custom-conf:ro
      - ./hdfs/config:/etc/hadoop/conf:ro
      - ./app/jobs:/opt/spark/jobs:ro
      - ./kerberos/krb5.conf:/etc/krb5.conf:ro
      - ${CUSTOMERDNA_RUNTIME_KERBEROS_KEYTAB_DIR:-./runtime/kerberos/keytabs}/spark:/etc/security/keytabs:ro
    command:
      - /bin/sh
      - -lc
      - >
        mkdir -p /opt/spark/work-dir/.ivy2/cache /opt/spark/work-dir/.ivy2/jars
        || exit 1;
        export KRB5CCNAME=FILE:/tmp/krb5cc_spark;
        kdestroy -c FILE:/tmp/krb5cc_spark >/dev/null 2>&1 || true;
        kinit -c FILE:/tmp/krb5cc_spark -kt ${CUSTOMERDNA_SPARK_KERBEROS_KEYTAB} ${CUSTOMERDNA_SPARK_KERBEROS_PRINCIPAL}
        || exit 1;
        (
             while true; do
               sleep 1800;
               kinit -c FILE:/tmp/krb5cc_spark -R || kinit -c FILE:/tmp/krb5cc_spark -kt ${CUSTOMERDNA_SPARK_KERBEROS_KEYTAB} ${CUSTOMERDNA_SPARK_KERBEROS_PRINCIPAL};
             done
           ) >/dev/null 2>&1 &
        while true; do sleep 3600; done

  spark-worker-2:
    image: ${CUSTOMERDNA_SPARK_IMAGE}
    container_name: spark-worker-2
    hostname: spark-worker-2.customerdna.local
    network_mode: host
    extra_hosts:
      - "namenode:${VM2_HOST_IP}"
      - "namenode.customerdna.local:${VM2_HOST_IP}"
      - "hive-metastore:${VM2_HOST_IP}"
      - "spark-worker-1:${VM1_HOST_IP}"
      - "spark-worker-1.customerdna.local:${VM1_HOST_IP}"
      - "spark-worker-2:${VM2_HOST_IP}"
      - "spark-worker-2.customerdna.local:${VM2_HOST_IP}"
      - "spark-worker-3:${VM3_HOST_IP}"
      - "spark-worker-3.customerdna.local:${VM3_HOST_IP}"
    restart: unless-stopped
    depends_on:
      - kerberos-kdc
      - spark-master
    environment:
      HOME: /opt/spark/work-dir
      IVY_HOME: /opt/spark/work-dir/.ivy2
      HADOOP_CONF_DIR: /etc/hadoop/conf
      KRB5_CONFIG: /etc/krb5.conf
      KRB5CCNAME: FILE:/tmp/krb5cc_spark
      KRB5_CLIENT_KTNAME: ${CUSTOMERDNA_SPARK_KERBEROS_KEYTAB}
      HADOOP_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf -Djava.security.auth.login.config=/opt/spark/custom-conf/jaas.conf -Djavax.security.auth.useSubjectCredsOnly=false
      SPARK_CONF_DIR: /opt/spark/custom-conf
      SPARK_CLASSPATH: ${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH}
      SPARK_SUBMIT_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf -Djava.security.auth.login.config=/opt/spark/custom-conf/jaas.conf -Djavax.security.auth.useSubjectCredsOnly=false -Divy.home=/opt/spark/work-dir/.ivy2 -Divy.cache.dir=/opt/spark/work-dir/.ivy2/cache
      SPARK_DAEMON_JAVA_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf -Djava.security.auth.login.config=/opt/spark/custom-conf/jaas.conf -Djavax.security.auth.useSubjectCredsOnly=false
      SPARK_LOCAL_IP: ${VM2_HOST_IP}
      SPARK_LOCAL_HOSTNAME: spark-worker-2.customerdna.local
      SPARK_PUBLIC_DNS: ${VM2_HOST_IP}
    command:
      - /bin/bash
      - -lc
      - >
        export KRB5CCNAME=FILE:/tmp/krb5cc_spark;
        kdestroy -c FILE:/tmp/krb5cc_spark >/dev/null 2>&1 || true;
        kinit -c FILE:/tmp/krb5cc_spark -kt ${CUSTOMERDNA_SPARK_KERBEROS_KEYTAB} ${CUSTOMERDNA_SPARK_KERBEROS_PRINCIPAL}
        || exit 1;
        (
             while true; do
               sleep 1800;
               kinit -c FILE:/tmp/krb5cc_spark -R || kinit -c FILE:/tmp/krb5cc_spark -kt ${CUSTOMERDNA_SPARK_KERBEROS_KEYTAB} ${CUSTOMERDNA_SPARK_KERBEROS_PRINCIPAL};
             done
           ) >/dev/null 2>&1 &
        exec /opt/spark/bin/spark-class
        org.apache.spark.deploy.worker.Worker
        spark://${VM2_HOST_IP}:${SPARK_MASTER_PORT}
        --webui-port ${SPARK_WORKER_WEBUI_PORT}
        --cores ${SPARK_WORKER_CORES}
        --memory ${SPARK_WORKER_MEMORY}
    volumes:
      - ${CUSTOMERDNA_RUNTIME_SPARK_EVENTS_DIR:-./runtime/spark/events}:/tmp/spark-events
      - ${CUSTOMERDNA_RUNTIME_SPARK_IVY2_DIR:-./runtime/spark/ivy2}:/opt/spark/work-dir/.ivy2
      - ./spark/config:/opt/spark/custom-conf:ro
      - ./hdfs/config:/etc/hadoop/conf:ro
      - ./kerberos/krb5.conf:/etc/krb5.conf:ro
      - ${CUSTOMERDNA_RUNTIME_KERBEROS_KEYTAB_DIR:-./runtime/kerberos/keytabs}/spark:/etc/security/keytabs:ro

  spark-history-server:
    image: ${CUSTOMERDNA_SPARK_IMAGE}
    container_name: spark-history-server
    hostname: spark-history-server
    network_mode: host
    extra_hosts:
      - "namenode:${VM2_HOST_IP}"
      - "namenode.customerdna.local:${VM2_HOST_IP}"
      - "hive-metastore:${VM2_HOST_IP}"
      - "spark-history-server:${VM2_HOST_IP}"
    restart: unless-stopped
    depends_on:
      - kerberos-kdc
      - spark-master
    environment:
      HOME: /opt/spark/work-dir
      IVY_HOME: /opt/spark/work-dir/.ivy2
      HADOOP_CONF_DIR: /etc/hadoop/conf
      KRB5_CONFIG: /etc/krb5.conf
      KRB5CCNAME: FILE:/tmp/krb5cc_spark
      KRB5_CLIENT_KTNAME: ${CUSTOMERDNA_SPARK_KERBEROS_KEYTAB}
      HADOOP_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf -Djava.security.auth.login.config=/opt/spark/custom-conf/jaas.conf -Djavax.security.auth.useSubjectCredsOnly=false
      SPARK_CONF_DIR: /opt/spark/custom-conf
      SPARK_CLASSPATH: ${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH}
      SPARK_SUBMIT_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf -Djava.security.auth.login.config=/opt/spark/custom-conf/jaas.conf -Djavax.security.auth.useSubjectCredsOnly=false -Divy.home=/opt/spark/work-dir/.ivy2 -Divy.cache.dir=/opt/spark/work-dir/.ivy2/cache
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=file:/tmp/spark-events
        -Dspark.history.ui.port=${SPARK_HISTORY_WEBUI_PORT}
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.history.HistoryServer
    volumes:
      - ${CUSTOMERDNA_RUNTIME_SPARK_EVENTS_DIR:-./runtime/spark/events}:/tmp/spark-events
      - ${CUSTOMERDNA_RUNTIME_SPARK_IVY2_DIR:-./runtime/spark/ivy2}:/opt/spark/work-dir/.ivy2
      - ./spark/config:/opt/spark/custom-conf:ro
      - ./hdfs/config:/etc/hadoop/conf:ro
      - ./kerberos/krb5.conf:/etc/krb5.conf:ro
      - ${CUSTOMERDNA_RUNTIME_KERBEROS_KEYTAB_DIR:-./runtime/kerberos/keytabs}/spark:/etc/security/keytabs:ro

  spark-thrift-server:
    image: ${CUSTOMERDNA_SPARK_IMAGE}
    container_name: spark-thrift-server
    hostname: spark-thrift-server
    network_mode: host
    extra_hosts:
      - "namenode:${VM2_HOST_IP}"
      - "namenode.customerdna.local:${VM2_HOST_IP}"
      - "hive-metastore:${VM2_HOST_IP}"
      - "spark-thrift-server:${VM2_HOST_IP}"
    restart: unless-stopped
    depends_on:
      - kerberos-kdc
      - spark-master
      - spark-worker-2
      - hive-metastore
    environment:
      HOME: /opt/spark/work-dir
      IVY_HOME: /opt/spark/work-dir/.ivy2
      HADOOP_CONF_DIR: /etc/hadoop/conf
      KRB5_CONFIG: /etc/krb5.conf
      KRB5CCNAME: FILE:/tmp/krb5cc_spark
      KRB5_CLIENT_KTNAME: ${CUSTOMERDNA_SPARK_KERBEROS_KEYTAB}
      HADOOP_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf -Djava.security.auth.login.config=/opt/spark/custom-conf/jaas.conf -Djavax.security.auth.useSubjectCredsOnly=false
      SPARK_CONF_DIR: /opt/spark/custom-conf
      SPARK_CLASSPATH: ${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH}
      SPARK_SUBMIT_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf -Djava.security.auth.login.config=/opt/spark/custom-conf/jaas.conf -Djavax.security.auth.useSubjectCredsOnly=false -Divy.home=/opt/spark/work-dir/.ivy2 -Divy.cache.dir=/opt/spark/work-dir/.ivy2/cache
      SPARK_NO_DAEMONIZE: "true"
    command:
      - /bin/bash
      - -lc
      - >
        export KRB5CCNAME=FILE:/tmp/krb5cc_spark;
        kdestroy -c FILE:/tmp/krb5cc_spark >/dev/null 2>&1 || true;
        kinit -c FILE:/tmp/krb5cc_spark -kt ${CUSTOMERDNA_SPARK_KERBEROS_KEYTAB} ${CUSTOMERDNA_SPARK_KERBEROS_PRINCIPAL}
        || exit 1;
        (
             while true; do
               sleep 1800;
               kinit -c FILE:/tmp/krb5cc_spark -R || kinit -c FILE:/tmp/krb5cc_spark -kt ${CUSTOMERDNA_SPARK_KERBEROS_KEYTAB} ${CUSTOMERDNA_SPARK_KERBEROS_PRINCIPAL};
             done
           ) >/dev/null 2>&1 &
        mkdir -p /opt/spark/logs &&
        /opt/spark/sbin/start-thriftserver.sh
        --master spark://${VM2_HOST_IP}:${SPARK_MASTER_PORT}
        --principal ${CUSTOMERDNA_SPARK_KERBEROS_PRINCIPAL}
        --keytab ${CUSTOMERDNA_SPARK_KERBEROS_KEYTAB}
        --driver-memory ${SPARK_THRIFT_DRIVER_MEMORY}
        --driver-class-path ${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH}
        --executor-memory ${SPARK_THRIFT_EXECUTOR_MEMORY}
        --executor-cores ${SPARK_THRIFT_EXECUTOR_CORES}
        --total-executor-cores ${SPARK_THRIFT_TOTAL_EXECUTOR_CORES}
        --conf spark.ui.port=${SPARK_THRIFT_WEBUI_PORT}
        --conf spark.eventLog.enabled=true
        --conf spark.eventLog.dir=file:/tmp/spark-events
        --conf spark.cores.max=${SPARK_THRIFT_TOTAL_EXECUTOR_CORES}
        --conf spark.driver.extraClassPath=${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH}
        --conf spark.executor.extraClassPath=${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH}
        --hiveconf hive.server2.thrift.port=${SPARK_THRIFT_PORT}
        --hiveconf hive.server2.thrift.bind.host=0.0.0.0
        &&
        tail -f /opt/spark/logs/*
    volumes:
      - ${CUSTOMERDNA_RUNTIME_SPARK_EVENTS_DIR:-./runtime/spark/events}:/tmp/spark-events
      - ${CUSTOMERDNA_RUNTIME_SPARK_IVY2_DIR:-./runtime/spark/ivy2}:/opt/spark/work-dir/.ivy2
      - ${CUSTOMERDNA_RUNTIME_SPARK_LOGS_DIR:-./runtime/spark/logs}:/opt/spark/logs
      - ./spark/config:/opt/spark/custom-conf:ro
      - ./hdfs/config:/etc/hadoop/conf:ro
      - ./kerberos/krb5.conf:/etc/krb5.conf:ro
      - ${CUSTOMERDNA_RUNTIME_KERBEROS_KEYTAB_DIR:-./runtime/kerberos/keytabs}/spark:/etc/security/keytabs:ro

  trino-coordinator:
    image: trinodb/trino:${TRINO_VERSION}
    container_name: trino-coordinator
    hostname: trino-coordinator
    network_mode: host
    restart: unless-stopped
    depends_on:
      - kerberos-kdc
      - hive-metastore
      - namenode
    extra_hosts:
      - "namenode:${VM2_HOST_IP}"
      - "namenode.customerdna.local:${VM2_HOST_IP}"
      - "hive-metastore:${VM2_HOST_IP}"
      - "datanode-1:${VM1_HOST_IP}"
      - "datanode-2:${VM2_HOST_IP}"
      - "datanode-3:${VM3_HOST_IP}"
    volumes:
      - ./trino/etc:/etc/trino:ro
      - ${CUSTOMERDNA_RUNTIME_TRINO_DATA_DIR:-./runtime/trino/data}:/var/trino/data
      - ./kerberos/krb5.conf:/etc/krb5.conf:ro
      - ${CUSTOMERDNA_RUNTIME_KERBEROS_KEYTAB_DIR:-./runtime/kerberos/keytabs}/trino:/etc/security/keytabs:ro
    healthcheck:
      disable: true

  trino-gateway:
    image: caddy:2-alpine
    container_name: trino-gateway
    hostname: trino-gateway
    network_mode: host
    restart: unless-stopped
    depends_on:
      - trino-coordinator
    environment:
      VM2_HOST_IP: ${VM2_HOST_IP}
      CUSTOMERDNA_TRINO_TLS_PORT: ${CUSTOMERDNA_TRINO_TLS_PORT:-8443}
    volumes:
      - ./trino/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CUSTOMERDNA_RUNTIME_TRINO_CADDY_DATA_DIR:-./runtime/trino/caddy/data}:/data
      - ${CUSTOMERDNA_RUNTIME_TRINO_CADDY_CONFIG_DIR:-./runtime/trino/caddy/config}:/config
      - ${CUSTOMERDNA_RUNTIME_TRINO_AUDIT_LOG_DIR:-./runtime/trino/audit_logs}:/var/log/caddy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: vm2_cadvisor
    network_mode: host
    restart: unless-stopped
    environment:
      CADVISOR_HEALTHCHECK_URL: http://127.0.0.1:8081/healthz
    command:
      - --port=8081
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
