connector.name=iceberg
iceberg.catalog.type=hive_metastore
hive.metastore.uri=thrift://10.10.252.12:9083
hive.metastore.authentication.type=KERBEROS
hive.metastore.service.principal=hive/hive-metastore@CUSTOMERDNA.LOCAL
hive.metastore.client.principal=trino@CUSTOMERDNA.LOCAL
hive.metastore.client.keytab=/etc/security/keytabs/trino.service.keytab
fs.hadoop.enabled=true
hive.config.resources=/etc/trino/core-site.xml,/etc/trino/hdfs-site.xml
hive.hdfs.authentication.type=KERBEROS
hive.hdfs.trino.principal=trino@CUSTOMERDNA.LOCAL
hive.hdfs.trino.keytab=/etc/security/keytabs/trino.service.keytab
hive.hdfs.wire-encryption.enabled=true
iceberg.file-format=PARQUET
iceberg.unique-table-location=true
