version: 2

models:
  - name: stg_bank_marketing
    description: Typed staging model for outbound bank marketing contacts and conversion outcomes.
    columns:
      - name: bank_record_id
        tests: [not_null]
  - name: stg_online_shoppers_intention
    description: Typed staging model for digital browsing sessions and purchase intent.
    columns:
      - name: shopper_session_id
        tests: [not_null]
  - name: stg_online_retail_2
    description: Typed staging model for retail transactions from Online Retail II.
    columns:
      - name: invoice_no
        tests: [not_null]
