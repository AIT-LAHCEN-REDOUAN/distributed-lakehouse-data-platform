version: 2

models:
  - name: int_bank_marketing_contacts
    description: Enriched outbound contact records with stable conversion and risk-oriented features.
    columns:
      - name: bank_record_id
        tests: [not_null]
  - name: int_online_shopper_sessions
    description: Session-level engagement features for digital intent analysis.
    columns:
      - name: shopper_session_id
        tests: [not_null]
  - name: int_online_retail_customer_sales
    description: Customer-level retail sales, recency, and monetary metrics.
    columns:
      - name: customer_id
        tests: [not_null, unique]
  - name: int_customer_360_feature_store
    description: Harmonized feature-store style entity table spanning campaign, web, and sales domains without unsafe row-level joins.
    columns:
      - name: unified_entity_id
        tests: [not_null, unique]
