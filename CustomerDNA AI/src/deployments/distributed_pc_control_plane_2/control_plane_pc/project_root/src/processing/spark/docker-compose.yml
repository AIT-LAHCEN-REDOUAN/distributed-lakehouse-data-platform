services:
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SPARK_BASE_IMAGE: ${CUSTOMERDNA_SPARK_BASE_IMAGE:-spark:4.1.2-python3}
        ICEBERG_VERSION: ${CUSTOMERDNA_SPARK_ICEBERG_VERSION:-1.11.0}
        POSTGRES_JDBC_VERSION: ${CUSTOMERDNA_SPARK_POSTGRES_JDBC_VERSION:-42.7.4}
    image: customerdna-spark:4.1.2-iceberg-v2
    container_name: spark-master
    hostname: spark-master
    environment:
      HOME: ${CUSTOMERDNA_SPARK_HOME_DIR:-/opt/spark/work-dir}
      IVY_HOME: ${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2}
      SPARK_CONF_DIR: /opt/spark/custom-conf
      SPARK_CLASSPATH: ${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH:-/opt/spark/jars/iceberg-spark-runtime-4.1_2.13-1.11.0.jar:/opt/spark/jars/postgresql-42.7.4.jar}
      SPARK_SUBMIT_OPTS: -Divy.home=${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2} -Divy.cache.dir=${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2}/cache
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - ${SPARK_MASTER_HOST}
      - --port
      - ${SPARK_MASTER_PORT}
      - --webui-port
      - ${SPARK_MASTER_WEBUI_PORT}
    ports:
      - "${SPARK_MASTER_PORT}:${SPARK_MASTER_PORT}"
      - "${SPARK_MASTER_WEBUI_PORT}:${SPARK_MASTER_WEBUI_PORT}"
    volumes:
      - spark_events:/tmp/spark-events
      - ./jobs:${CUSTOMERDNA_SPARK_JOBS_ROOT_IN_CONTAINER:-/opt/spark/jobs}
      - ./config:/opt/spark/custom-conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      kafka_shared:
        aliases:
          - spark-master

  spark-worker:
    image: customerdna-spark:4.1.2-iceberg-v2
    container_name: spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    environment:
      HOME: ${CUSTOMERDNA_SPARK_HOME_DIR:-/opt/spark/work-dir}
      IVY_HOME: ${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2}
      SPARK_CONF_DIR: /opt/spark/custom-conf
      SPARK_CLASSPATH: ${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH:-/opt/spark/jars/iceberg-spark-runtime-4.1_2.13-1.11.0.jar:/opt/spark/jars/postgresql-42.7.4.jar}
      SPARK_SUBMIT_OPTS: -Divy.home=${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2} -Divy.cache.dir=${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2}/cache
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://${SPARK_MASTER_HOST}:${SPARK_MASTER_PORT}
      - --webui-port
      - ${SPARK_WORKER_WEBUI_PORT}
      - --cores
      - ${SPARK_WORKER_CORES}
      - --memory
      - ${SPARK_WORKER_MEMORY}
    ports:
      - "${SPARK_WORKER_WEBUI_PORT}:${SPARK_WORKER_WEBUI_PORT}"
    volumes:
      - spark_events:/tmp/spark-events
      - ./jobs:${CUSTOMERDNA_SPARK_JOBS_ROOT_IN_CONTAINER:-/opt/spark/jobs}
      - ./config:/opt/spark/custom-conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      kafka_shared:
        aliases:
          - spark-worker

  spark-history-server:
    image: customerdna-spark:4.1.2-iceberg-v2
    container_name: spark-history-server
    hostname: spark-history-server
    depends_on:
      - spark-master
    environment:
      HOME: ${CUSTOMERDNA_SPARK_HOME_DIR:-/opt/spark/work-dir}
      IVY_HOME: ${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2}
      SPARK_CONF_DIR: /opt/spark/custom-conf
      SPARK_CLASSPATH: ${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH:-/opt/spark/jars/iceberg-spark-runtime-4.1_2.13-1.11.0.jar:/opt/spark/jars/postgresql-42.7.4.jar}
      SPARK_SUBMIT_OPTS: -Divy.home=${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2} -Divy.cache.dir=${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2}/cache
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=file:/tmp/spark-events
        -Dspark.history.ui.port=${SPARK_HISTORY_WEBUI_PORT}
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.history.HistoryServer
    ports:
      - "${SPARK_HISTORY_WEBUI_PORT}:${SPARK_HISTORY_WEBUI_PORT}"
    volumes:
      - spark_events:/tmp/spark-events
      - ./config:/opt/spark/custom-conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      kafka_shared:
        aliases:
          - spark-history-server

  spark-thrift-server:
    image: customerdna-spark:4.1.2-iceberg-v2
    container_name: spark-thrift-server
    hostname: spark-thrift-server
    depends_on:
      - spark-master
      - spark-worker
    environment:
      HOME: ${CUSTOMERDNA_SPARK_HOME_DIR:-/opt/spark/work-dir}
      IVY_HOME: ${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2}
      SPARK_CONF_DIR: /opt/spark/custom-conf
      SPARK_CLASSPATH: ${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH:-/opt/spark/jars/iceberg-spark-runtime-4.1_2.13-1.11.0.jar:/opt/spark/jars/postgresql-42.7.4.jar}
      SPARK_SUBMIT_OPTS: -Divy.home=${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2} -Divy.cache.dir=${CUSTOMERDNA_SPARK_IVY_HOME:-/opt/spark/work-dir/.ivy2}/cache
      SPARK_NO_DAEMONIZE: "true"
    command:
      - /bin/bash
      - -lc
      - >
        mkdir -p /opt/spark/logs &&
        /opt/spark/sbin/start-thriftserver.sh
        --master spark://${SPARK_MASTER_HOST}:${SPARK_MASTER_PORT}
        --driver-memory ${SPARK_THRIFT_DRIVER_MEMORY}
        --driver-class-path ${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH:-/opt/spark/jars/iceberg-spark-runtime-4.1_2.13-1.11.0.jar:/opt/spark/jars/postgresql-42.7.4.jar}
        --executor-memory ${SPARK_THRIFT_EXECUTOR_MEMORY}
        --executor-cores ${SPARK_THRIFT_EXECUTOR_CORES}
        --total-executor-cores ${SPARK_THRIFT_TOTAL_EXECUTOR_CORES}
        --conf spark.ui.port=${SPARK_THRIFT_WEBUI_PORT}
        --conf spark.eventLog.enabled=false
        --conf spark.cores.max=${SPARK_THRIFT_TOTAL_EXECUTOR_CORES}
        --conf spark.sql.catalog.customerdna.cache-enabled=false
        --conf spark.sql.artifact.isolation.enabled=false
        --conf spark.driver.extraClassPath=${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH:-/opt/spark/jars/iceberg-spark-runtime-4.1_2.13-1.11.0.jar:/opt/spark/jars/postgresql-42.7.4.jar}
        --conf spark.executor.extraClassPath=${CUSTOMERDNA_SPARK_EXTRA_CLASSPATH:-/opt/spark/jars/iceberg-spark-runtime-4.1_2.13-1.11.0.jar:/opt/spark/jars/postgresql-42.7.4.jar}
        --hiveconf hive.server2.thrift.port=${SPARK_THRIFT_PORT}
        --hiveconf hive.server2.thrift.bind.host=0.0.0.0
        &&
        tail -f /opt/spark/logs/*
    ports:
      - "${SPARK_THRIFT_PORT}:${SPARK_THRIFT_PORT}"
      - "${SPARK_THRIFT_WEBUI_PORT}:${SPARK_THRIFT_WEBUI_PORT}"
    volumes:
      - spark_events:/tmp/spark-events
      - ./jobs:${CUSTOMERDNA_SPARK_JOBS_ROOT_IN_CONTAINER:-/opt/spark/jobs}
      - ./config:/opt/spark/custom-conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      kafka_shared:
        aliases:
          - spark-thrift-server

volumes:
  spark_events:

networks:
  kafka_shared:
    external: true
    name: customerdna_kafka_shared
