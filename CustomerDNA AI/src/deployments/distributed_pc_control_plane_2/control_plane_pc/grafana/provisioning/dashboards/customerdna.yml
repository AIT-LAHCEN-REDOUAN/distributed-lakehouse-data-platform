    orgId: 1
    folder: CustomerDNA Monitoring
    folderUid: customerdna-monitoring
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/customerdna
      foldersFromFilesStructure: false
