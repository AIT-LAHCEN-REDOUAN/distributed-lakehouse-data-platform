apiVersion: 1

deleteDatasources:
  - name: prometheus
    orgId: 1

prune: true

datasources:
  - name: prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://host.docker.internal:9090
    isDefault: true
    editable: true
    version: 1
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 3.0.0
      timeInterval: 15s
