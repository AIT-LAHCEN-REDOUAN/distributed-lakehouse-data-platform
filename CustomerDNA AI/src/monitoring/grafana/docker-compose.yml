services:
  grafana:
    image: grafana/grafana:latest
    container_name: customerdna_grafana
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${CUSTOMERDNA_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${CUSTOMERDNA_GRAFANA_ADMIN_PASSWORD:-change_me}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards/customerdna:ro
    restart: unless-stopped

volumes:
  grafana_data:
