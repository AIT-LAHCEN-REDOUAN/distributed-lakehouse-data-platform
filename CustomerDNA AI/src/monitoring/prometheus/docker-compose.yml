services:
  prometheus:
    image: prom/prometheus:latest
    container_name: customerdna_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    restart: unless-stopped
    depends_on:
      - postgres_exporter
      - cadvisor
      - pipeline_metrics_exporter

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: customerdna_postgres_exporter
    env_file:
      - .env
    environment:
      DATA_SOURCE_URI: "${CUSTOMERDNA_POSTGRES_HOST}:${CUSTOMERDNA_POSTGRES_PORT}/${CUSTOMERDNA_POSTGRES_DB}?sslmode=disable"
      DATA_SOURCE_USER: "${CUSTOMERDNA_POSTGRES_USER}"
      DATA_SOURCE_PASS: "${CUSTOMERDNA_POSTGRES_PASSWORD}"
    ports:
      - "9187:9187"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: customerdna_cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  pipeline_metrics_exporter:
    image: python:3.11-slim
    container_name: customerdna_pipeline_metrics_exporter
    working_dir: /monitoring
    command:
      - python
      - /monitoring/exporters/pipeline_metrics_exporter.py
    volumes:
      - ../:/monitoring:ro
    ports:
      - "9109:9109"
    restart: unless-stopped

volumes:
  prometheus_data:
