x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.2.2-python3.11}
  env_file:
    - .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    # Required for username/password login in Airflow 3
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: ${AIRFLOW__CORE__DEFAULT_TIMEZONE:-Africa/Casablanca}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: ${AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK:-true}
    AIRFLOW__CORE__TEST_CONNECTION: ${AIRFLOW__CORE__TEST_CONNECTION:-Enabled}

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API__BASE_URL: http://localhost:8080

    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    CUSTOMERDNA_AIRFLOW_KAFKA_BOOTSTRAP_SERVERS: ${CUSTOMERDNA_AIRFLOW_KAFKA_BOOTSTRAP_SERVERS:-broker:29092}
    CUSTOMERDNA_AIRFLOW_MINIO_ENDPOINT: ${CUSTOMERDNA_AIRFLOW_MINIO_ENDPOINT:-minio:9000}
    CUSTOMERDNA_MINIO_ACCESS_KEY: ${CUSTOMERDNA_MINIO_ACCESS_KEY}
    CUSTOMERDNA_MINIO_SECRET_KEY: ${CUSTOMERDNA_MINIO_SECRET_KEY}
    CUSTOMERDNA_MINIO_BUCKET: ${CUSTOMERDNA_MINIO_BUCKET:-customerdna-bronze}
    CUSTOMERDNA_MINIO_OBJECT_PREFIX: ${CUSTOMERDNA_MINIO_OBJECT_PREFIX:-bronze}

    _PIP_ADDITIONAL_REQUIREMENTS: -r /requirements.txt

  volumes:
    # Airflow folders
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config

    # Mount full CustomerDNA AI project
    - ../..:/opt/airflow/CustomerDNA_AI

    # Airflow Python dependencies
    - ./requirements.txt:/requirements.txt

  user: "${AIRFLOW_UID:-50000}:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - default
    - kafka_shared

  depends_on:
    airflow-postgres:
      condition: service_healthy


services:
  airflow-postgres:
    image: postgres:16
    container_name: customerdna_airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always


  airflow-init:
    <<: *airflow-common
    container_name: customerdna_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate

        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Redouan \
          --lastname CustomerDNA \
          --role Admin \
          --email admin@example.com || true

        echo "Airflow initialization completed."
    environment:
      <<: *airflow-common-env
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
    restart: "no"


  airflow-api-server:
    <<: *airflow-common
    container_name: customerdna_airflow_api_server
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/version')\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully


  airflow-scheduler:
    <<: *airflow-common
    container_name: customerdna_airflow_scheduler
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy


  airflow-dag-processor:
    <<: *airflow-common
    container_name: customerdna_airflow_dag_processor
    command: dag-processor
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy


  airflow-triggerer:
    <<: *airflow-common
    container_name: customerdna_airflow_triggerer
    command: triggerer
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy


volumes:
  airflow_postgres_data:

networks:
  kafka_shared:
    external: true
    name: customerdna_kafka_shared
