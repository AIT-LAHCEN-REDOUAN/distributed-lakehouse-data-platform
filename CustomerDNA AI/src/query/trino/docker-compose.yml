services:
  trino:
    image: trinodb/trino:${TRINO_VERSION:-477}
    container_name: trino
    hostname: trino
    ports:
      - "${TRINO_HOST_PORT:-8088}:8080"
    volumes:
      - ./etc:/etc/trino:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      kafka_shared:
        aliases:
          - trino

networks:
  kafka_shared:
    external: true
    name: customerdna_kafka_shared
