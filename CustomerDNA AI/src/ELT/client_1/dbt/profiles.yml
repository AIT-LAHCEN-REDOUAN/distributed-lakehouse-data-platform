# CustomerDNA AI - Client 1 dbt Profiles Configuration

customerdna_client1:
  target: dev

  outputs:
    dev:
      type: postgres
      host: "{{ env_var('CUSTOMERDNA_POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('CUSTOMERDNA_POSTGRES_PORT', 5440) | int }}"
      user: "{{ env_var('CUSTOMERDNA_POSTGRES_USER', 'postgres') }}"
      pass: "{{ env_var('CUSTOMERDNA_POSTGRES_PASSWORD', '') }}"
      dbname: "client1_DW"

      # Keep this neutral.
      # The real schemas are controlled by dbt_project.yml + generate_schema_name.sql
      schema: "public"

      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
      retries: 1

    prod:
      type: postgres
      host: "{{ env_var('PROD_POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('PROD_POSTGRES_PORT', 5440) | int }}"
      user: "{{ env_var('PROD_POSTGRES_USER', 'postgres') }}"
      pass: "{{ env_var('PROD_POSTGRES_PASSWORD', '') }}"
      dbname: "client1_DW"
      schema: "public"
      threads: 8
      keepalives_idle: 0
      connect_timeout: 10
      retries: 3

    test:
      type: postgres
      host: "{{ env_var('CUSTOMERDNA_POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('CUSTOMERDNA_POSTGRES_PORT', 5440) | int }}"
      user: "{{ env_var('CUSTOMERDNA_POSTGRES_USER', 'postgres') }}"
      pass: "{{ env_var('CUSTOMERDNA_POSTGRES_PASSWORD', '') }}"
      dbname: "client1_DW"
      schema: "public"
      threads: 2
      keepalives_idle: 0
      connect_timeout: 10
      retries: 1