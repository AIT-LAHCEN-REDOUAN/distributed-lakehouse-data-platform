version: 2

models:
  - name: analytics_customer_segments
    description: "Final customer-facing segmentation mart at one row per customer."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: customer_value_tier
        tests:
          - accepted_values:
              arguments:
                values: ['High Value', 'Upper Mid Value', 'Mid Value', 'Low Value', 'Unclassified']
      - name: engagement_tier
        tests:
          - accepted_values:
              arguments:
                values: ['Highly Engaged', 'Engaged', 'Moderately Engaged', 'Low Engagement', 'Unclassified']
      - name: retention_status
        tests:
          - accepted_values:
              arguments:
                values: ['Churned', 'High Risk', 'Watchlist', 'Stable', 'Unknown']
      - name: primary_purchase_channel
        tests:
          - accepted_values:
              arguments:
                values: ['Web', 'Catalog', 'Store', 'Unknown']
      - name: final_customer_segment
        tests:
          - accepted_values:
              arguments:
                values: ['Lost Customer', 'VIP Active', 'High Value Low Engagement', 'Growth Opportunity', 'Dormant', 'Core Customer']

  - name: analytics_product_performance
    description: "Final product performance mart at one row per item."
    columns:
      - name: item_id
        tests:
          - not_null
          - unique
      - name: product_activity_tier
        tests:
          - accepted_values:
              arguments:
                values: ['High Activity', 'Active', 'Moderate Activity', 'Low Activity', 'Unclassified']
      - name: product_conversion_tier
        tests:
          - accepted_values:
              arguments:
                values: ['High Conversion', 'Good Conversion', 'Average Conversion', 'Low Conversion', 'Unclassified']
      - name: product_performance_segment
        tests:
          - accepted_values:
              arguments:
                values: ['Star Product', 'Cart Interest Low Conversion', 'High Awareness Low Intent', 'Low Visibility', 'Emerging Product']
      - name: analytics_price_band
        tests:
          - accepted_values:
              arguments:
                values: ['Price Unknown or Free', 'Budget', 'Affordable', 'Mid Market', 'Premium']

  - name: analytics_sales_analytics
    description: "Final customer-level sales analytics mart."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: sales_value_band
        tests:
          - accepted_values:
              arguments:
                values: ['No Sales', 'Small Account', 'Medium Account', 'Large Account', 'Top Account']
      - name: order_frequency_band
        tests:
          - accepted_values:
              arguments:
                values: ['Frequent Buyer', 'Regular Buyer', 'Occasional Buyer', 'New Buyer', 'No Valid Orders']
      - name: cancellation_risk_band
        tests:
          - accepted_values:
              arguments:
                values: ['High Cancellation Risk', 'Moderate Cancellation Risk', 'Low Cancellation Risk', 'No Cancellation Risk']
      - name: geography_profile
        tests:
          - accepted_values:
              arguments:
                values: ['Multi-Country Shopper', 'Single-Country Shopper', 'Unknown Geography']

  - name: analytics_business_intelligence
    description: "Single-row executive KPI mart."
    columns:
      - name: generated_at
        tests:
          - not_null
      - name: total_customers
        tests:
          - not_null
      - name: total_products
        tests:
          - not_null