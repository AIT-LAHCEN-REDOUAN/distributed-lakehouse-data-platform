version: 2

models:
  - name: marketing_recommendation_base
    description: "Customer-level recommendation serving table built from customer_360 and persona_base. It translates value, churn, engagement, and persona signals into campaign objectives and next-best actions."
    columns:
      - name: customer_id
        description: "Stable customer grain for recommendation delivery."
        tests:
          - not_null
          - unique

      - name: recommendation_priority_band
        description: "Operational recommendation urgency band."
        tests:
          - accepted_values:
              arguments:
                values:
                  - Critical
                  - High
                  - Medium
                  - Low

      - name: recommended_campaign_objective
        description: "Primary campaign objective for the customer."
        tests:
          - accepted_values:
              arguments:
                values:
                  - Retention
                  - Growth
                  - Loyalty Expansion
                  - Reactivation
                  - Nurture

      - name: recommended_offer_type
        description: "Suggested commercial offer style."
        tests:
          - accepted_values:
              arguments:
                values:
                  - Win-Back Incentive
                  - Premium Upsell
                  - Discount Offer
                  - Digital Cross-Sell
                  - Bundle Recommendation
                  - Personalized Content

      - name: recommended_channel
        description: "Suggested outbound marketing channel."
        tests:
          - accepted_values:
              arguments:
                values:
                  - Email
                  - SMS
                  - Push / Mobile

      - name: recommended_contact_timing
        description: "Suggested contact timing."
        tests:
          - accepted_values:
              arguments:
                values:
                  - Immediate
                  - Within 24 Hours
                  - This Week
                  - This Month
