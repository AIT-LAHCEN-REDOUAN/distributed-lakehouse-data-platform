version: 2

models:
  - name: segmentation_feature_base
    description: "Customer-level feature base for segmentation and clustering workloads. It combines standardized demographic, behavioral, channel, spend, and engagement features from customer_360 with reference business labels for downstream validation."
    columns:
      - name: customer_id
        description: "Stable customer grain for segmentation feature engineering."
        tests:
          - not_null
          - unique

      - name: customer_360_record_source
        description: "Coverage lineage showing which upstream marts contributed to the underlying customer_360 row."
        tests:
          - accepted_values:
              arguments:
                values:
                  - segments_sales_profile
                  - segments_and_sales
                  - segments_and_profile
                  - sales_and_profile
                  - segments_only
                  - sales_only
                  - profile_only
                  - unknown

      - name: has_personality_data_flag
        description: "Binary coverage flag indicating whether the customer has marketing personality source data."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]

      - name: has_churn_data_flag
        description: "Binary coverage flag indicating whether the customer has churn source data."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]

      - name: has_customer_profile_flag
        description: "Binary coverage flag indicating whether the customer exists in the reusable intermediate profile path."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]

      - name: has_online_retail_summary_flag
        description: "Binary coverage flag indicating whether online retail transactional summary features are available."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]

      - name: feature_has_churned_flag
        description: "Binary churn outcome flag retained for segmentation analysis and filtering."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]

      - name: feature_has_any_complaint_flag
        description: "Binary complaint history flag."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]

      - name: feature_is_multi_channel_customer_flag
        description: "Binary indicator for multi-channel customer behavior."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]

      - name: reference_final_customer_segment
        description: "Business-facing segment label kept for benchmarking the segmentation model output."
        tests:
          - accepted_values:
              arguments:
                values:
                  - Lost Customer
                  - VIP Active
                  - High Value Low Engagement
                  - Growth Opportunity
                  - Dormant
                  - Core Customer
                  - Unknown

      - name: reference_customer_value_tier
        description: "Spend-based tier retained as a business reference label."
        tests:
          - accepted_values:
              arguments:
                values:
                  - High Value
                  - Upper Mid Value
                  - Mid Value
                  - Low Value
                  - Unclassified

      - name: reference_engagement_tier
        description: "Engagement tier retained as a business reference label."
        tests:
          - accepted_values:
              arguments:
                values:
                  - Highly Engaged
                  - Engaged
                  - Moderately Engaged
                  - Low Engagement
                  - Unclassified

      - name: reference_retention_status
        description: "Retention label retained for downstream explainability and evaluation."
        tests:
          - accepted_values:
              arguments:
                values:
                  - Churned
                  - High Risk
                  - Watchlist
                  - Stable
                  - Unknown
