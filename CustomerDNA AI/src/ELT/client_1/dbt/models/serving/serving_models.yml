version: 2

models:
  - name: customer_360
    description: "Unified customer-level serving model that combines segmentation, customer profile, and sales context into one trusted 360-degree view."
    columns:
      - name: customer_id
        description: "Unified customer identifier at one row per customer."
        tests:
          - not_null
          - unique

      - name: customer_360_record_source
        description: "Shows which trusted upstream marts contributed to the assembled customer_360 row."
        tests:
          - accepted_values:
              arguments:
                values:
                  - segments_sales_profile
                  - segments_and_sales
                  - segments_and_profile
                  - sales_and_profile
                  - segments_only
                  - sales_only
                  - profile_only
                  - unknown

      - name: final_customer_segment
        description: "Final business-facing customer segment label inherited from the analytics segmentation mart."
        tests:
          - accepted_values:
              arguments:
                values:
                  - Lost Customer
                  - VIP Active
                  - High Value Low Engagement
                  - Growth Opportunity
                  - Dormant
                  - Core Customer

      - name: retention_status
        description: "Customer retention interpretation derived from churn state and risk score."
        tests:
          - accepted_values:
              arguments:
                values:
                  - Churned
                  - High Risk
                  - Watchlist
                  - Stable
                  - Unknown

      - name: customer_value_tier
        description: "Spend-based customer value tier."
        tests:
          - accepted_values:
              arguments:
                values:
                  - High Value
                  - Upper Mid Value
                  - Mid Value
                  - Low Value
                  - Unclassified

      - name: engagement_tier
        description: "Engagement-tier classification derived from the blended engagement score."
        tests:
          - accepted_values:
              arguments:
                values:
                  - Highly Engaged
                  - Engaged
                  - Moderately Engaged
                  - Low Engagement
                  - Unclassified

      - name: primary_purchase_channel
        description: "Dominant purchase channel classification for the customer."
        tests:
          - accepted_values:
              arguments:
                values:
                  - Web
                  - Catalog
                  - Store
                  - Unknown

      - name: sales_value_band
        description: "Customer sales-value band inherited from the sales analytics mart."
        tests:
          - accepted_values:
              arguments:
                values:
                  - No Sales
                  - Small Account
                  - Medium Account
                  - Large Account
                  - Top Account
