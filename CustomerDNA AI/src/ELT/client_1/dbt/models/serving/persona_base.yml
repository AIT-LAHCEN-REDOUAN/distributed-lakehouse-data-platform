version: 2

models:
  - name: persona_base
    description: "Customer-level persona foundation built from customer_360. It translates analytical attributes into interpretable customer personas, lifecycle views, and communication guidance."
    columns:
      - name: customer_id
        description: "Stable customer grain for persona generation."
        tests:
          - not_null
          - unique

      - name: persona_name
        description: "Primary persona label derived from customer behavior and value signals."
        tests:
          - accepted_values:
              arguments:
                values:
                  - Premium Loyalist
                  - At-Risk High Spender
                  - Growth Challenger
                  - Dormant Customer
                  - Lost Customer
                  - Promo-Driven Regular
                  - Digital Explorer
                  - Core Relationship Customer

      - name: digital_affinity
        description: "Digital engagement orientation."
        tests:
          - accepted_values:
              arguments:
                values:
                  - High Digital Affinity
                  - Moderate Digital Affinity
                  - Low Digital Affinity

      - name: price_sensitivity
        description: "Customer sensitivity to promotions and deal-driven behavior."
        tests:
          - accepted_values:
              arguments:
                values:
                  - High Price Sensitivity
                  - Moderate Price Sensitivity
                  - Low Price Sensitivity

      - name: lifecycle_stage
        description: "Simplified lifecycle interpretation."
        tests:
          - accepted_values:
              arguments:
                values:
                  - Lost
                  - At Risk
                  - Dormant
                  - New
                  - Established
                  - Active
