version: 2

models:
  - name: stg_customer_personality
    description: "Cleaned customer personality and marketing campaign source at one row per customer."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: has_complained
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: customer_segment
        tests:
          - accepted_values:
              arguments:
                values: ['Active High-Value', 'Active Low-Value', 'At-Risk', 'Inactive', 'Unknown']
      - name: is_high_income
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: is_high_spender
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  - name: stg_ecommerce_churn
    description: "Cleaned churn source at one row per customer."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: has_churned
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: has_complained
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: satisfaction_score
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: has_recent_complaint
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: is_multi_channel_customer
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  - name: stg_online_retail
    description: "Cleaned online retail invoice-line source."
    columns:
      - name: invoice_number
        tests:
          - not_null
      - name: stock_code
        tests:
          - not_null
      - name: invoice_date
        tests:
          - not_null
      - name: is_cancelled_invoice
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: is_valid_sale
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: is_wholesale_transaction
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: is_uk_customer
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: is_free_item
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: has_missing_description
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: is_international_customer
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  - name: stg_retailrocket_events
    description: "Cleaned RetailRocket event stream at one row per event."
    columns:
      - name: event_timestamp_ms
        tests:
          - not_null
      - name: visitor_id
        tests:
          - not_null
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['view', 'addtocart', 'transaction']
      - name: item_id
        tests:
          - not_null
      - name: is_view_event
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: is_add_to_cart_event
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: is_transaction_event
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: has_transaction
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: day_type
        tests:
          - accepted_values:
              arguments:
                values: ['Weekday', 'Weekend']

  - name: stg_retailrocket_item_properties
    description: "Cleaned RetailRocket property history at one row per item/property/timestamp."
    columns:
      - name: property_timestamp_ms
        tests:
          - not_null
      - name: item_id
        tests:
          - not_null
      - name: property_name
        tests:
          - not_null
      - name: property_value
        tests:
          - not_null
      - name: is_numeric_property
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: is_categorical_property
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  - name: stg_retailrocket_category_tree
    description: "Cleaned RetailRocket category hierarchy."
    columns:
      - name: category_id
        tests:
          - not_null
          - unique
      - name: is_root_category
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: category_level
        tests:
          - accepted_values:
              arguments:
                values: ['Root', 'Child']