# Sources Configuration for CustomerDNA AI - Client 1
# Defines the raw data tables in the raw_data schema

version: 2

sources:
  - name: raw_data
    description: "Raw, unprocessed client data preserved in original format"
    schema: "raw_data"
    tables:
      - name: marketing_campaign
        description: "Customer Personality Analysis dataset - demographic and purchase behavior data"
        columns:
          - name: "id"
            description: "Unique customer identifier"
            tests:
              - unique
              - not_null
          - name: "year_birth"
            description: "Customer birth year"
          - name: "education"
            description: "Customer education level"
          - name: "marital_status"
            description: "Customer marital status"
          - name: "income"
            description: "Annual household income"
          - name: "kidhome"
            description: "Number of children in household"
          - name: "teenhome"
            description: "Number of teenagers in household"
          - name: "dt_customer"
            description: "Date customer joined the company"
          - name: "recency"
            description: "Number of days since last purchase"
          - name: "mntwines"
            description: "Amount spent on wine in last 2 years"
          - name: "mntfruits"
            description: "Amount spent on fruits in last 2 years"
          - name: "mntmeatproducts"
            description: "Amount spent on meat in last 2 years"
          - name: "mntfishproducts"
            description: "Amount spent on fish in last 2 years"
          - name: "mntsweetproducts"
            description: "Amount spent on sweets in last 2 years"
          - name: "mntgoldprods"
            description: "Amount spent on gold in last 2 years"
          - name: "acceptedcmp1"
            description: "Response to campaign 1 (1=yes, 0=no)"
          - name: "acceptedcmp2"
            description: "Response to campaign 2 (1=yes, 0=no)"
          - name: "acceptedcmp3"
            description: "Response to campaign 3 (1=yes, 0=no)"
          - name: "acceptedcmp4"
            description: "Response to campaign 4 (1=yes, 0=no)"
          - name: "acceptedcmp5"
            description: "Response to campaign 5 (1=yes, 0=no)"
          - name: "response"
            description: "Response to last campaign (1=yes, 0=no)"
          - name: "numdealspurchases"
            description: "Number of purchases made with a discount"
          - name: "numwebpurchases"
            description: "Number of purchases made through the company's website"
          - name: "numcatalogpurchases"
            description: "Number of purchases made using a catalogue"
          - name: "numstorepurchases"
            description: "Number of purchases made directly in stores"
          - name: "numwebvisitsmonth"
            description: "Number of visits to company's website in the last month"
          - name: "complain"
            description: "Customer complaint in last 2 years (1=yes, 0=no)"
          - name: "z_costcontact"
            description: "Cost of contacting customer"
          - name: "z_revenue"
            description: "Revenue generated from customer"
            
      - name: e_commerce_customer_churn
        description: "E-commerce Customer Churn dataset - transaction history and churn labels"
        columns:
          - name: "customerid"
            description: "Unique customer identifier"
            tests:
              - unique
              - not_null
          - name: "churn"
            description: "Churn indicator (1=churned, 0=active)"
          - name: "tenure"
            description: "Customer tenure in months"
          - name: "preferredlogindevice"
            description: "Preferred login device"
          - name: "citytier"
            description: "City tier classification (1-3)"
          - name: "warehousetohome"
            description: "Distance from warehouse to home in km"
          - name: "preferredpaymentmode"
            description: "Preferred payment method"
          - name: "gender"
            description: "Customer gender"
          - name: "hourspendonapp"
            description: "Hours spent on mobile app"
          - name: "numberofdeviceregistered"
            description: "Number of devices registered"
          - name: "preferedordercat"
            description: "Preferred order category"
          - name: "satisfactionscore"
            description: "Customer satisfaction score (1-5)"
          - name: "maritalstatus"
            description: "Customer marital status"
          - name: "numberofaddress"
            description: "Number of addresses registered"
          - name: "complain"
            description: "Complaint indicator (1=complained, 0=no complaint)"
          - name: "orderamounthikefromlastyear"
            description: "Order amount increase from last year"
          - name: "couponused"
            description: "Number of coupons used"
          - name: "ordercount"
            description: "Total number of orders"
          - name: "daysincelastorder"
            description: "Days since last order"
          - name: "cashbackamount"
            description: "Total cashback earned"
        
      - name: events
        description: "RetailRocket Recommender System dataset - clickstream and event data"
        columns:
          - name: "timestamp"
            description: "Event timestamp in Unix milliseconds"
            tests:
              - not_null
          - name: "visitorid"
            description: "Visitor/user identifier"
            tests:
              - not_null
          - name: "event"
            description: "Event type (view, addtocart, transaction)"
            tests:
              - not_null
          - name: "itemid"
            description: "Item identifier"
            tests:
              - not_null
          - name: "transactionid"
            description: "Transaction identifier (nullable)"
        
      - name: item_properties
        description: "RetailRocket item properties data"
        columns:
          - name: "timestamp"
            description: "Property timestamp in Unix milliseconds"
            tests:
              - not_null
          - name: "itemid"
            description: "Item identifier"
            tests:
              - not_null
          - name: "property"
            description: "Property name"
            tests:
              - not_null
          - name: "value"
            description: "Property value"
            tests:
              - not_null
        
      - name: category_tree
        description: "RetailRocket category hierarchy data"
        columns:
          - name: "categoryid"
            description: "Category identifier"
            tests:
              - unique
              - not_null
          - name: "parentid"
            description: "Parent category identifier (nullable for root categories)"
        
      - name: online_retail
        description: "UCI Online Retail II dataset - multi-year retail transactions"
        columns:
          - name: "invoice"
            description: "Invoice number (alphanumeric, 'C' prefix indicates cancellation)"
            tests:
              - not_null
          - name: "stockcode"
            description: "Product stock code"
            tests:
              - not_null
          - name: "description"
            description: "Product description"
          - name: "quantity"
            description: "Quantity purchased"
            tests:
              - not_null
          - name: "invoicedate"
            description: "Invoice date and time"
            tests:
              - not_null
          - name: "price"
            description: "Unit price"
            tests:
              - not_null
          - name: "customer_id"
            description: "Customer identifier"
          - name: "country"
            description: "Customer country"