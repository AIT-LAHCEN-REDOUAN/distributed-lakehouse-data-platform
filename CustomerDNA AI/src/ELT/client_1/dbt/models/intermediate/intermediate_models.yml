version: 2

models:
  - name: int_customer_profile
    description: "Customer 360 base joining personality and churn domains at one row per customer."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: has_any_complaint
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: has_personality_data
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: has_churn_data
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: customer_record_source
        tests:
          - accepted_values:
              arguments:
                values: ['personality_and_churn', 'personality_only', 'churn_only', 'unknown']

  - name: int_online_retail_customer_summary
    description: "Aggregated online retail metrics at one row per customer."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: int_customer_behavior
    description: "Reusable customer behavior mart combining customer profile and online retail behavior."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: has_customer_profile
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: has_online_retail_summary
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: behavior_record_source
        tests:
          - accepted_values:
              arguments:
                values: ['profile_and_retail', 'profile_only', 'retail_only', 'unknown']

  - name: int_retailrocket_event_summary
    description: "Item-level RetailRocket event summary."
    columns:
      - name: item_id
        tests:
          - not_null
          - unique

  - name: int_retailrocket_latest_item_properties
    description: "Latest known value for each item/property pair."
    columns:
      - name: item_id
        tests:
          - not_null
      - name: property_name
        tests:
          - not_null
      - name: property_recency_rank
        tests:
          - accepted_values:
              arguments:
                values: [1]
                quote: false

  - name: int_product_analysis
    description: "Reusable one-row-per-item product analysis base."
    columns:
      - name: item_id
        tests:
          - not_null
          - unique
      - name: has_event_data
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: has_property_data
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: has_category_mapping
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: product_record_source
        tests:
          - accepted_values:
              arguments:
                values: ['events_and_properties', 'events_only', 'properties_only', 'unknown']