# CustomerDNA AI - Client 1 dbt Project Configuration
# Simplified configuration for dbt-fusion 2.0

name: 'customerdna_client1'
version: '1.0.0'

profile: 'customerdna_client1'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  customerdna_client1:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    analytics:
      +materialized: table
      +schema: analytics

tests:
  customerdna_client1:
    +severity: warn

vars:
  project_name: "CustomerDNA AI - Client 1"
  client_id: "1"
  client_name: "Client 1"
  database_name: "client1_DW"
  raw_schema: "raw_data"
  staging_schema: "staging"
  intermediate_schema: "intermediate"
  analytics_schema: "analytics"